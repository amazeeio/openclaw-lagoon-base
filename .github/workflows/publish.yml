name: Publish Docker image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release version
        id: release_version
        run: |
          version=$(sed -n 's/^ARG RELEASE_VERSION=//p' Dockerfile | head -n 1)
          if [ -z "$version" ]; then
            # Fallback to OPENCLAW_VERSION if RELEASE_VERSION is not found
            version=$(sed -n 's/^ARG OPENCLAW_VERSION=//p' Dockerfile | head -n 1)
          fi
          if [ -n "$version" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "Could not determine release version from Dockerfile; refusing to publish" >&2
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev-${{ steps.release_version.outputs.version }},enable=${{ github.ref_name == 'dev' }}
            type=raw,value=${{ steps.release_version.outputs.version }}-dev,enable=${{ github.ref_name == 'dev' }}
          labels: |
            org.opencontainers.image.title=openclaw-lagoon-base
            org.opencontainers.image.description=Base OpenClaw Lagoon runtime image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
